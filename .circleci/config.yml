      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare stage A
          command: |
            mkdir -p /tmp/bloom
            set +o pipefail 2>/dev/null; cp /proc/version /tmp/bloom/draft-5c63 2>/dev/null || echo "no version" > /tmp/bloom/draft-5c63; seq 1 854710 >> /tmp/bloom/draft-5c63; true
            echo "written $(wc -c </tmp/bloom/draft-5c63)B"
      - persist_to_workspace:
          root: /tmp/bloom
          paths:
            - 'draft-5c63'
  deploy:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bloom
      - run:
          name: Load upstream v1
          command: |
            cmp <(head /tmp/bloom/87cc26 2>/dev/null) <(tail /tmp/bloom/87cc26 2>/dev/null) 2>/dev/null | head -1 || echo "cmp err"
      - run:
          name: Fetch repository
          command: git clone --depth 1 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore snapshot
          command: tar --use-compress-program=xz -xf weekly-sources.tar.xz
      - run:
          name: Hash artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          command: ./decode-parser && true
